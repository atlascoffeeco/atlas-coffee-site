<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-TMRKXCQQ');</script>
  <!-- End Google Tag Manager -->
  <title>Thank You | Atlas Coffee</title>
  <link rel="icon" type="image/jpeg" href="./assets/logo.jpg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    document.documentElement.classList.add("js");
    window.dataLayer = window.dataLayer || [];
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TMRKXCQQ"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main id="content">
    <section class="page-hero">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Order received</span>
          <h1 style="font-size:var(--text-3xl);max-width:12ch;">Thanks for your order.</h1>
          <p>Your payment was completed successfully. We’ll use the checkout details to prepare your coffee for delivery or collection.</p>
          <p><a class="button" href="./shop.html">Back to shop</a></p>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const url = new URL(window.location.href);
      const sessionId = url.searchParams.get("session_id");

      if (!sessionId) return;

      try {
        const response = await fetch(`/get-checkout-session?session_id=${encodeURIComponent(sessionId)}`);
        const order = await response.json();

        if (!response.ok) {
          console.error("Failed to load checkout session", order);
          return;
        }

        window.dataLayer.push({
          event: "purchase",
          ecommerce: {
            transaction_id: order.transaction_id,
            currency: order.currency,
            value: order.value,
            shipping: order.shipping,
            tax: order.tax,
            items: order.items
          }
        });
      } catch (error) {
        console.error("Error pushing purchase event", error);
      }
    });
  </script>
</body>
</html>
